<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#131210">
<title>Перекуп · Учёт прибыли</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#131210;
  --surface:#1D1B17;
  --surface-2:#252119;
  --line:#34302A;
  --ink:#F3EEE4;
  --ink-dim:#8F897C;
  --ink-faint:#5C574D;
  --car:#FF6A39;
  --car-soft:rgba(255,106,57,.15);
  --phone:#4FD1E0;
  --phone-soft:rgba(79,209,224,.15);
  --pos:#9BD46B;
  --neg:#E5636B;
  --radius-lg:20px;
  --radius:14px;
  --radius-sm:9px;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100dvh;
  overscroll-behavior:none;
}
button, input{font-family:inherit; color:inherit;}
.mono{font-family:'JetBrains Mono','SF Mono',Consolas,monospace; font-variant-numeric:tabular-nums;}
button:focus-visible, input:focus-visible{outline:2px solid var(--phone); outline-offset:2px;}

.app{display:flex; flex-direction:column; min-height:100dvh;}

/* HEADER */
.header{
  position:sticky; top:0; z-index:10;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 14px;
  background:linear-gradient(180deg, var(--bg) 70%, rgba(19,18,16,.85));
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.header-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.eyebrow{font-family:'Oswald','Arial Narrow',sans-serif; font-size:11px; letter-spacing:.14em; color:var(--ink-dim); font-weight:600;}
.menu-wrap{position:relative;}
.menu-btn{background:none; border:none; color:var(--ink-dim); font-size:20px; line-height:1; padding:4px 8px; cursor:pointer; border-radius:8px;}
.menu-btn:active{background:var(--surface);}
.menu-drop{position:absolute; right:0; top:32px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; min-width:170px; box-shadow:0 8px 24px rgba(0,0,0,.4); display:none; z-index:20;}
.menu-drop.open{display:block;}
.menu-item{display:block; width:100%; text-align:left; background:none; border:none; padding:12px 14px; font-size:14px; color:var(--neg); cursor:pointer;}
.menu-item:active{background:rgba(229,72,77,.12);}

.odo-wrap{display:flex; align-items:baseline; gap:6px; margin-bottom:12px;}
.odo-box{
  display:flex; align-items:baseline; gap:6px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:10px 16px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.03);
}
.odo-value{font-size:30px; font-weight:700; letter-spacing:.01em;}
.odo-currency{font-size:18px; color:var(--ink-dim); font-weight:500;}

#splitWrap.hidden{display:none;}
.split-bar{display:flex; height:6px; border-radius:4px; overflow:hidden; background:var(--surface-2); margin-bottom:8px;}
.split-seg{height:100%; transition:width .5s ease;}
.split-seg.phone{background:var(--phone);}
.split-seg.car{background:var(--car);}
.split-legend{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-dim); margin-bottom:14px;}
.split-legend .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:middle;}
.dot.phone{background:var(--phone);} .dot.car{background:var(--car);}

.stats-row{display:flex; gap:8px; margin-bottom:14px;}
.stat-chip{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 10px;}
.stat-chip .num{font-size:15px; font-weight:600;}
.stat-chip .lbl{font-family:'Oswald','Arial Narrow',sans-serif; font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:1px;}

.segmented{position:relative; display:flex; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:3px;}
.seg-highlight{position:absolute; top:3px; bottom:3px; left:3px; width:calc(33.333% - 2px); background:var(--surface-2); border:1px solid var(--line); border-radius:7px; transition:transform .25s cubic-bezier(.4,0,.2,1); z-index:0;}
.seg-btn{flex:1; position:relative; z-index:1; background:none; border:none; padding:8px 4px; font-size:13px; font-weight:600; color:var(--ink-dim); cursor:pointer; border-radius:7px;}
.seg-btn.active{color:var(--ink);}

/* LIST */
.list{flex:1; padding:14px 18px 100px; overflow-y:auto;}
.empty{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 20px; color:var(--ink-dim);}
.empty-icon{width:48px; height:48px; margin-bottom:14px; opacity:.4;}
.empty-icon svg{width:100%; height:100%;}
.empty-title{font-size:15px; color:var(--ink); font-weight:600; margin-bottom:4px;}
.empty-sub{font-size:13px;}

.deal-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; margin-bottom:9px; cursor:pointer; position:relative; overflow:hidden;}
.deal-card:active{background:var(--surface-2);}
.deal-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px;}
.deal-card.cat-phone::before{background:var(--phone);}
.deal-card.cat-car::before{background:var(--car);}
.deal-row1{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px;}
.deal-name-wrap{display:flex; align-items:center; gap:9px; min-width:0;}
.deal-icon{width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.deal-icon.cat-phone{background:var(--phone-soft); color:var(--phone);}
.deal-icon.cat-car{background:var(--car-soft); color:var(--car);}
.deal-icon svg{width:15px; height:15px;}
.deal-name{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.deal-profit{font-size:14.5px; font-weight:700; flex-shrink:0;}
.deal-profit.pos{color:var(--pos);}
.deal-profit.neg{color:var(--neg);}
.tag-progress{font-family:'Oswald','Arial Narrow',sans-serif; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); background:var(--surface-2); border:1px solid var(--line); padding:3px 7px; border-radius:6px; flex-shrink:0;}
.deal-row2{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-dim); padding-left:35px;}
.deal-row3{font-size:11.5px; color:var(--ink-dim); padding-left:35px; margin-top:3px;}

/* BOTTOM BAR */
.bottom-bar{position:fixed; left:0; right:0; bottom:0; padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 12px); background:linear-gradient(0deg, var(--bg) 60%, rgba(19,18,16,0)); z-index:10;}
.add-btn{width:100%; background:var(--ink); color:var(--bg); border:none; border-radius:var(--radius); padding:15px; font-size:14px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; cursor:pointer; font-family:'Oswald',sans-serif;}
.add-btn:active{opacity:.85;}

/* SHEET */
.backdrop{position:fixed; inset:0; background:rgba(10,9,7,.6); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .25s; z-index:30;}
.backdrop.open{opacity:1; pointer-events:auto;}
.sheet{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-radius:22px 22px 0 0; border:1px solid var(--line); border-bottom:none; padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 20px); transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1); z-index:31; max-height:88vh; overflow-y:auto;}
.sheet.open{transform:translateY(0);}
.sheet-grabber{width:36px; height:4px; background:var(--line); border-radius:3px; margin:4px auto 14px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.sheet-title{font-family:'Oswald','Arial Narrow',sans-serif; font-size:18px; font-weight:600;}
.sheet-close{background:var(--surface-2); border:1px solid var(--line); color:var(--ink-dim); width:30px; height:30px; border-radius:50%; font-size:15px; cursor:pointer;}

.field{margin-bottom:14px;}
.field-label{font-family:'Oswald','Arial Narrow',sans-serif; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin-bottom:7px; display:block; font-weight:600;}
.field-input{width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 13px; font-size:15px; color:var(--ink); color-scheme:dark;}
.field-input:focus{outline:none; border-color:var(--ink-faint);}
.field-input.err{border-color:var(--neg);}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}

.expense-add-row{display:flex; gap:8px; margin-bottom:8px;}
.expense-add-row .field-input{padding:11px 12px; font-size:14px;}
#expNameInput{flex:1; min-width:0;}
#expAmountInput{flex:0 0 84px;}
.expense-add-btn{flex-shrink:0; width:40px; background:var(--ink); color:var(--bg); border:none; border-radius:var(--radius-sm); font-size:19px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.expense-add-btn:active{opacity:.85;}
.expense-item{display:flex; align-items:center; gap:8px; padding:9px 10px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:6px;}
.expense-item-name{flex:1; font-size:13px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.expense-item-amount{font-size:13px; color:var(--ink-dim); flex-shrink:0;}
.expense-item-remove{background:none; border:none; color:var(--ink-dim); font-size:17px; line-height:1; padding:0 3px; cursor:pointer; flex-shrink:0;}
.expense-item-remove:active{color:var(--neg);}
.expense-total{font-size:12px; color:var(--ink-dim); text-align:right; min-height:15px;}

.toggle-2{display:flex; gap:8px;}
.toggle-btn{flex:1; padding:12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface-2); color:var(--ink-dim); font-size:13.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:7px; cursor:pointer;}
.toggle-btn svg{width:15px; height:15px;}
.toggle-btn.active.cat-phone{border-color:var(--phone); color:var(--phone); background:var(--phone-soft);}
.toggle-btn.active.cat-car{border-color:var(--car); color:var(--car); background:var(--car-soft);}
.toggle-btn.active.status{border-color:var(--ink-faint); color:var(--ink); background:var(--surface);}

.hidden{display:none !important;}

.save-btn{width:100%; border:none; border-radius:var(--radius); padding:15px; font-size:14px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; cursor:pointer; font-family:'Oswald',sans-serif; background:var(--ink); color:var(--bg); margin-top:6px;}
.save-btn:active{opacity:.85;}
.delete-btn{width:100%; border:none; background:none; color:var(--neg); padding:13px; font-size:13.5px; font-weight:600; cursor:pointer; text-align:center;}

.backdrop-confirm{position:fixed; inset:0; background:rgba(10,9,7,.6); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40;}
.backdrop-confirm.open{opacity:1; pointer-events:auto;}
.confirm-sheet{position:fixed; left:20px; right:20px; top:50%; transform:translateY(-50%) scale(.9); background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px; z-index:41; opacity:0; pointer-events:none; transition:all .2s;}
.confirm-sheet.open{opacity:1; pointer-events:auto; transform:translateY(-50%) scale(1);}
.confirm-title{font-family:'Oswald','Arial Narrow',sans-serif; font-size:17px; font-weight:600; margin-bottom:6px;}
.confirm-text{font-size:13.5px; color:var(--ink-dim); margin-bottom:18px; line-height:1.4;}
.confirm-row{display:flex; gap:10px;}
.confirm-row button{flex:1; padding:12px; border-radius:var(--radius-sm); border:1px solid var(--line); font-size:13.5px; font-weight:600; cursor:pointer;}
.confirm-cancel{background:var(--surface-2); color:var(--ink);}
.confirm-danger{background:var(--neg); color:#fff; border-color:var(--neg) !important;}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{transition-duration:.01ms !important; animation-duration:.01ms !important;}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="eyebrow" id="scopeLabel">ПРИБЫЛЬ · ВСЕГО</div>
      <div class="menu-wrap">
        <button class="menu-btn" id="menuBtn" type="button">⋯</button>
        <div class="menu-drop" id="menuDrop">
          <button class="menu-item" id="clearAllBtn" type="button">Очистить всё</button>
        </div>
      </div>
    </div>
    <div class="odo-wrap">
      <div class="odo-box">
        <span class="mono odo-value" id="odoValue">0</span><span class="odo-currency">₽</span>
      </div>
    </div>
    <div id="splitWrap">
      <div class="split-bar"><div class="split-seg phone" id="splitPhone"></div><div class="split-seg car" id="splitCar"></div></div>
      <div class="split-legend">
        <span><i class="dot phone"></i><span id="phonePct">iPhone · 0%</span></span>
        <span><span id="carPct">Машины · 0%</span></span>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-chip"><div class="num mono" id="statCount">0</div><div class="lbl">Сделок</div></div>
      <div class="stat-chip"><div class="num mono" id="statMargin">—</div><div class="lbl">Средняя маржа</div></div>
    </div>
    <div class="segmented">
      <div class="seg-highlight" id="segHighlight"></div>
      <button class="seg-btn active" data-filter="all" type="button">Все</button>
      <button class="seg-btn" data-filter="phone" type="button">iPhone</button>
      <button class="seg-btn" data-filter="car" type="button">Машины</button>
    </div>
  </div>

  <div class="list" id="list"></div>

  <div class="bottom-bar">
    <button class="add-btn" id="addBtn" type="button">+ Добавить сделку</button>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grabber"></div>
  <div class="sheet-head">
    <div class="sheet-title" id="sheetTitle">Новая сделка</div>
    <button class="sheet-close" id="sheetClose" type="button">✕</button>
  </div>

  <div class="field">
    <label class="field-label">Категория</label>
    <div class="toggle-2">
      <button class="toggle-btn cat-phone" id="catPhoneBtn" type="button"></button>
      <button class="toggle-btn cat-car" id="catCarBtn" type="button"></button>
    </div>
  </div>

  <div class="field">
    <label class="field-label">Название</label>
    <input class="field-input" id="nameInput" type="text" placeholder="iPhone 14 Pro 256GB">
  </div>

  <div class="field-row">
    <div class="field">
      <label class="field-label">Закупка, ₽</label>
      <input class="field-input" id="buyInput" type="number" inputmode="numeric" min="0" placeholder="0">
    </div>
    <div class="field">
      <label class="field-label">Дата закупки</label>
      <input class="field-input" id="buyDateInput" type="date">
    </div>
  </div>

  <div class="field">
    <label class="field-label">Расходы</label>
    <div id="expenseList"></div>
    <div class="expense-add-row">
      <input class="field-input" id="expNameInput" type="text" placeholder="Например, мойка">
      <input class="field-input mono" id="expAmountInput" type="number" inputmode="numeric" min="0" placeholder="₽">
      <button class="expense-add-btn" id="expAddBtn" type="button">+</button>
    </div>
    <div class="expense-total" id="expenseTotal"></div>
  </div>

  <div class="field">
    <label class="field-label">Статус</label>
    <div class="toggle-2">
      <button class="toggle-btn status" id="statusProgressBtn" type="button">В работе</button>
      <button class="toggle-btn status" id="statusSoldBtn" type="button">Продано</button>
    </div>
  </div>

  <div id="soldFields">
    <div class="field-row">
      <div class="field">
        <label class="field-label">Продажа, ₽</label>
        <input class="field-input" id="sellInput" type="number" inputmode="numeric" min="0" placeholder="0">
      </div>
      <div class="field">
        <label class="field-label">Дата продажи</label>
        <input class="field-input" id="sellDateInput" type="date">
      </div>
    </div>
  </div>

  <button class="save-btn" id="saveBtn" type="button">Сохранить</button>
  <button class="delete-btn hidden" id="deleteBtn" type="button">Удалить сделку</button>
</div>

<div class="backdrop-confirm" id="confirmBackdrop"></div>
<div class="confirm-sheet" id="confirmSheet">
  <div class="confirm-title">Удалить всё?</div>
  <div class="confirm-text">Все сделки будут удалены без возможности восстановления.</div>
  <div class="confirm-row">
    <button class="confirm-cancel" id="confirmCancelBtn" type="button">Отмена</button>
    <button class="confirm-danger" id="confirmOkBtn" type="button">Удалить</button>
  </div>
</div>

<script>
// ---------- ICONS ----------
const ICON_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.3"/><line x1="10" y1="18" x2="14" y2="18"/></svg>';
const ICON_CAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 16.5 L4.8 10.8 C5.1 9.5 6.3 8.6 7.6 8.6 H16.4 C17.7 8.6 18.9 9.5 19.2 10.8 L20.5 16.5"/><path d="M2.5 16.5 H21.5 V18 C21.5 18.6 21 19 20.5 19 H19 C18.4 19 18 18.6 18 18 V17 H6 V18 C6 18.6 5.6 19 5 19 H3.5 C3 19 2.5 18.6 2.5 18 Z"/><circle cx="7" cy="17" r="1.4"/><circle cx="17" cy="17" r="1.4"/></svg>';
const ICON_EMPTY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 13h3"/></svg>';

// ---------- TELEGRAM ----------
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
try{
  if (tg){
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#131210');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#131210');
  }
}catch(e){}
function haptic(type){
  try{
    if (!tg || !tg.HapticFeedback) return;
    if (type==='select') tg.HapticFeedback.selectionChanged();
    else if (type==='success') tg.HapticFeedback.notificationOccurred('success');
    else if (type==='error') tg.HapticFeedback.notificationOccurred('error');
    else tg.HapticFeedback.impactOccurred('medium');
  }catch(e){}
}

// ---------- STORAGE (Claude preview -> localStorage -> memory) ----------
const STORAGE_KEY = 'deals_v1';
const hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage !== null);

async function storageGetRaw(key){
  if (hasClaudeStorage){
    try{
      const res = await window.storage.get(key);
      return res ? res.value : null;
    }catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSetRaw(key, value){
  if (hasClaudeStorage){
    try{ await window.storage.set(key, value); return; }catch(e){}
  }
  try{ localStorage.setItem(key, value); }catch(e){}
}

// ---------- STATE ----------
let deals = [];
let filter = 'all';
let editingId = null;
let formCategory = 'phone';
let formStatus = 'progress';
let formExpenses = [];
let displayedTotal = 0;
let deleteConfirmPending = false;
let deleteConfirmTimer = null;

// ---------- HELPERS ----------
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){
  const d = new Date();
  const mo = String(d.getMonth()+1).padStart(2,'0');
  const da = String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${mo}-${da}`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtInt(n){
  const neg = n < 0;
  const abs = Math.round(Math.abs(n));
  const s = abs.toLocaleString('ru-RU').replace(/\u00A0/g,' ');
  return (neg?'−':'') + s;
}
function fmtMoney(n){ return fmtInt(n) + ' ₽'; }
function fmtSigned(n){
  const neg = n < 0;
  const abs = Math.round(Math.abs(n));
  const s = abs.toLocaleString('ru-RU').replace(/\u00A0/g,' ');
  return (neg?'−':'+') + s + ' ₽';
}
function fmtDateShort(iso){
  if (!iso) return '';
  const parts = iso.split('-');
  if (parts.length!==3) return iso;
  return `${parts[2]}.${parts[1]}.${parts[0].slice(2)}`;
}
function expensesSum(d){ return (d.expenses||[]).reduce((s,e)=>s+(e.amount||0),0); }
function totalCost(d){ return (d.buyPrice||0) + expensesSum(d); }
function profitOf(d){ return (d.sellPrice||0) - totalCost(d); }
function marginOf(d){ const c = totalCost(d); return c ? (profitOf(d)/c*100) : 0; }
function isSold(d){ return d.status==='sold' && d.sellPrice!=null; }
function sortKey(d){ return (d.status==='sold' && d.sellDate) ? d.sellDate : d.buyDate; }

function filteredDeals(){
  if (filter==='all') return deals;
  return deals.filter(d=>d.category===filter);
}

// ---------- RENDER: HEADER ----------
function renderHeader(){
  const list = filteredDeals();
  const sold = list.filter(isSold);
  const total = sold.reduce((s,d)=>s+profitOf(d),0);

  const label = filter==='all' ? 'ВСЕГО' : (filter==='phone' ? 'IPHONE' : 'МАШИНЫ');
  document.getElementById('scopeLabel').textContent = 'ПРИБЫЛЬ · ' + label;

  animateTotal(total);

  const splitWrap = document.getElementById('splitWrap');
  let sum = 0;
  if (filter==='all'){
    const phoneAbs = Math.abs(deals.filter(d=>d.category==='phone' && isSold(d)).reduce((s,d)=>s+profitOf(d),0));
    const carAbs = Math.abs(deals.filter(d=>d.category==='car' && isSold(d)).reduce((s,d)=>s+profitOf(d),0));
    sum = phoneAbs+carAbs;
    if (sum > 0){
      const phonePct = Math.round(phoneAbs/sum*100);
      const carPct = 100 - phonePct;
      document.getElementById('splitPhone').style.width = phonePct + '%';
      document.getElementById('splitCar').style.width = carPct + '%';
      document.getElementById('phonePct').textContent = 'iPhone · ' + phonePct + '%';
      document.getElementById('carPct').textContent = 'Машины · ' + carPct + '%';
    }
  }
  splitWrap.classList.toggle('hidden', !(filter==='all' && sum>0));

  document.getElementById('statCount').textContent = list.length;
  if (sold.length){
    const avg = sold.reduce((s,d)=>s+marginOf(d),0)/sold.length;
    document.getElementById('statMargin').textContent = avg.toFixed(1)+'%';
  } else {
    document.getElementById('statMargin').textContent = '—';
  }
}

function animateTotal(target){
  const el = document.getElementById('odoValue');
  const color = target<0 ? 'var(--neg)' : (target>0 ? 'var(--pos)' : 'var(--ink)');
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.style.color = color;
  if (reduced){ displayedTotal = target; el.textContent = fmtInt(target); return; }

  const start = displayedTotal;
  const delta = target - start;
  if (Math.abs(delta) < 1){ displayedTotal = target; el.textContent = fmtInt(target); return; }

  const duration = 550;
  const t0 = performance.now();
  function tick(now){
    const t = Math.min(1, (now-t0)/duration);
    const eased = 1-Math.pow(1-t,3);
    const current = start + delta*eased;
    el.textContent = fmtInt(current);
    if (t<1){ requestAnimationFrame(tick); }
    else { displayedTotal = target; el.textContent = fmtInt(target); }
  }
  requestAnimationFrame(tick);
}

// ---------- RENDER: LIST ----------
function renderList(){
  const list = filteredDeals().slice().sort((a,b)=> sortKey(b).localeCompare(sortKey(a)));
  const container = document.getElementById('list');
  if (!list.length){
    const msg = filter==='all' ? 'Пока нет сделок' : (filter==='phone' ? 'Нет сделок по iPhone' : 'Нет сделок по машинам');
    container.innerHTML = `<div class="empty"><div class="empty-icon">${ICON_EMPTY}</div><div class="empty-title">${msg}</div><div class="empty-sub">Нажми «Добавить сделку», чтобы начать</div></div>`;
    return;
  }
  container.innerHTML = list.map(d=>{
    const icon = d.category==='phone' ? ICON_PHONE : ICON_CAR;
    const catClass = 'cat-'+d.category;
    if (isSold(d)){
      const profit = profitOf(d);
      const margin = marginOf(d);
      return `<div class="deal-card ${catClass}" data-id="${d.id}">
        <div class="deal-row1">
          <div class="deal-name-wrap">
            <div class="deal-icon ${catClass}">${icon}</div>
            <div class="deal-name">${escapeHtml(d.name)}</div>
          </div>
          <div class="deal-profit ${profit>=0?'pos':'neg'} mono">${fmtSigned(profit)}</div>
        </div>
        <div class="deal-row2 mono">
          <span>${fmtMoney(d.buyPrice)} → ${fmtMoney(d.sellPrice)}</span>
          <span>${margin.toFixed(1)}% · ${fmtDateShort(d.sellDate||d.buyDate)}</span>
        </div>
        ${expensesSum(d)>0 ? `<div class="deal-row3 mono">Расходы: ${fmtMoney(expensesSum(d))}</div>` : ''}
      </div>`;
    } else {
      return `<div class="deal-card ${catClass}" data-id="${d.id}">
        <div class="deal-row1">
          <div class="deal-name-wrap">
            <div class="deal-icon ${catClass}">${icon}</div>
            <div class="deal-name">${escapeHtml(d.name)}</div>
          </div>
          <div class="tag-progress">В работе</div>
        </div>
        <div class="deal-row2 mono">
          <span>Закупка ${fmtMoney(d.buyPrice)}</span>
          <span>${fmtDateShort(d.buyDate)}</span>
        </div>
        ${expensesSum(d)>0 ? `<div class="deal-row3 mono">Расходы: ${fmtMoney(expensesSum(d))}</div>` : ''}
      </div>`;
    }
  }).join('');

  container.querySelectorAll('.deal-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      openEdit(card.getAttribute('data-id'));
    });
  });
}

function render(){
  renderHeader();
  renderList();
}

// ---------- SEGMENTED CONTROL ----------
const segBtns = document.querySelectorAll('.seg-btn');
const segHighlight = document.getElementById('segHighlight');
const filterIndex = {all:0, phone:1, car:2};
segBtns.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    filter = btn.getAttribute('data-filter');
    segBtns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    segHighlight.style.transform = `translateX(${filterIndex[filter]*100}%)`;
    haptic('select');
    render();
  });
});

// ---------- MENU ----------
const menuBtn = document.getElementById('menuBtn');
const menuDrop = document.getElementById('menuDrop');
menuBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  menuDrop.classList.toggle('open');
});
document.addEventListener('click', ()=>{ menuDrop.classList.remove('open'); });
document.getElementById('clearAllBtn').addEventListener('click', ()=>{
  menuDrop.classList.remove('open');
  openConfirm();
});

// ---------- CONFIRM (clear all) ----------
const confirmBackdrop = document.getElementById('confirmBackdrop');
const confirmSheet = document.getElementById('confirmSheet');
function openConfirm(){ confirmBackdrop.classList.add('open'); confirmSheet.classList.add('open'); }
function closeConfirm(){ confirmBackdrop.classList.remove('open'); confirmSheet.classList.remove('open'); }
document.getElementById('confirmCancelBtn').addEventListener('click', closeConfirm);
confirmBackdrop.addEventListener('click', closeConfirm);
document.getElementById('confirmOkBtn').addEventListener('click', async ()=>{
  deals = [];
  await storageSetRaw(STORAGE_KEY, JSON.stringify(deals));
  closeConfirm();
  haptic('success');
  render();
});

// ---------- SHEET (add/edit) ----------
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
const sheetTitle = document.getElementById('sheetTitle');
const nameInput = document.getElementById('nameInput');
const buyInput = document.getElementById('buyInput');
const buyDateInput = document.getElementById('buyDateInput');
const sellInput = document.getElementById('sellInput');
const sellDateInput = document.getElementById('sellDateInput');
const soldFields = document.getElementById('soldFields');
const catPhoneBtn = document.getElementById('catPhoneBtn');
const catCarBtn = document.getElementById('catCarBtn');
const statusProgressBtn = document.getElementById('statusProgressBtn');
const statusSoldBtn = document.getElementById('statusSoldBtn');
const deleteBtn = document.getElementById('deleteBtn');
const expNameInput = document.getElementById('expNameInput');
const expAmountInput = document.getElementById('expAmountInput');
const expenseListContainer = document.getElementById('expenseList');
const expenseTotalEl = document.getElementById('expenseTotal');
const expAddBtn = document.getElementById('expAddBtn');

catPhoneBtn.innerHTML = ICON_PHONE + '<span>iPhone</span>';
catCarBtn.innerHTML = ICON_CAR + '<span>Машина</span>';

function setFormCategory(cat){
  formCategory = cat;
  catPhoneBtn.classList.toggle('active', cat==='phone');
  catCarBtn.classList.toggle('active', cat==='car');
  nameInput.placeholder = cat==='phone' ? 'iPhone 14 Pro 256GB' : 'BMW E90 320i';
}
function setFormStatus(st){
  formStatus = st;
  statusProgressBtn.classList.toggle('active', st==='progress');
  statusSoldBtn.classList.toggle('active', st==='sold');
  soldFields.classList.toggle('hidden', st!=='sold');
}
catPhoneBtn.addEventListener('click', ()=>{ setFormCategory('phone'); haptic('select'); });
catCarBtn.addEventListener('click', ()=>{ setFormCategory('car'); haptic('select'); });
statusProgressBtn.addEventListener('click', ()=>{ setFormStatus('progress'); haptic('select'); });
statusSoldBtn.addEventListener('click', ()=>{ setFormStatus('sold'); haptic('select'); });

function renderExpenseList(){
  if (!formExpenses.length){
    expenseListContainer.innerHTML = '';
    expenseTotalEl.textContent = '';
    return;
  }
  expenseListContainer.innerHTML = formExpenses.map(e=>`
    <div class="expense-item">
      <span class="expense-item-name">${escapeHtml(e.name)}</span>
      <span class="expense-item-amount mono">${fmtMoney(e.amount)}</span>
      <button class="expense-item-remove" data-id="${e.id}" type="button">×</button>
    </div>`).join('');
  expenseListContainer.querySelectorAll('.expense-item-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      formExpenses = formExpenses.filter(x=>x.id!==btn.getAttribute('data-id'));
      renderExpenseList();
      haptic('select');
    });
  });
  const total = formExpenses.reduce((s,e)=>s+e.amount,0);
  expenseTotalEl.textContent = 'Итого расходов: ' + fmtMoney(total);
}

expAddBtn.addEventListener('click', ()=>{
  const name = expNameInput.value.trim();
  const amount = parseFloat(expAmountInput.value);
  expNameInput.classList.remove('err');
  expAmountInput.classList.remove('err');
  if (!name || !amount || amount<=0){
    if (!name) expNameInput.classList.add('err');
    if (!amount || amount<=0) expAmountInput.classList.add('err');
    haptic('error');
    return;
  }
  formExpenses.push({ id: uid(), name, amount });
  expNameInput.value = '';
  expAmountInput.value = '';
  renderExpenseList();
  haptic('success');
});

function openSheet(){ backdrop.classList.add('open'); sheet.classList.add('open'); }
function closeSheet(){
  backdrop.classList.remove('open');
  sheet.classList.remove('open');
  if (deleteConfirmTimer){ clearTimeout(deleteConfirmTimer); deleteConfirmTimer=null; }
  deleteConfirmPending = false;
  deleteBtn.textContent = 'Удалить сделку';
}
function clearFieldErrors(){ [nameInput, buyInput, sellInput, expNameInput, expAmountInput].forEach(i=>i.classList.remove('err')); }

function openAdd(){
  editingId = null;
  sheetTitle.textContent = 'Новая сделка';
  deleteBtn.classList.add('hidden');
  nameInput.value = '';
  buyInput.value = '';
  sellInput.value = '';
  buyDateInput.value = todayISO();
  sellDateInput.value = todayISO();
  setFormCategory(filter==='car' ? 'car' : 'phone');
  setFormStatus('progress');
  formExpenses = [];
  renderExpenseList();
  clearFieldErrors();
  openSheet();
}

function openEdit(id){
  const d = deals.find(x=>x.id===id);
  if (!d) return;
  editingId = id;
  sheetTitle.textContent = 'Сделка';
  deleteBtn.classList.remove('hidden');
  nameInput.value = d.name;
  buyInput.value = d.buyPrice;
  sellInput.value = d.sellPrice!=null ? d.sellPrice : '';
  buyDateInput.value = d.buyDate || todayISO();
  sellDateInput.value = d.sellDate || todayISO();
  setFormCategory(d.category);
  setFormStatus(d.status);
  formExpenses = (d.expenses||[]).map(e=>({...e}));
  renderExpenseList();
  clearFieldErrors();
  openSheet();
}

document.getElementById('addBtn').addEventListener('click', ()=>{ haptic('select'); openAdd(); });
document.getElementById('sheetClose').addEventListener('click', closeSheet);
backdrop.addEventListener('click', closeSheet);

async function persist(){ await storageSetRaw(STORAGE_KEY, JSON.stringify(deals)); }

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const pendName = expNameInput.value.trim();
  const pendAmount = parseFloat(expAmountInput.value);
  if (pendName && pendAmount > 0){
    formExpenses.push({ id: uid(), name: pendName, amount: pendAmount });
    expNameInput.value = '';
    expAmountInput.value = '';
  }
  clearFieldErrors();
  let ok = true;
  const name = nameInput.value.trim();
  const buy = parseFloat(buyInput.value);
  const sell = parseFloat(sellInput.value);

  if (!name){ nameInput.classList.add('err'); ok=false; }
  if (!buy || buy<=0){ buyInput.classList.add('err'); ok=false; }
  if (formStatus==='sold' && (!sell || sell<=0)){ sellInput.classList.add('err'); ok=false; }
  if (!ok){ haptic('error'); return; }

  if (editingId){
    const d = deals.find(x=>x.id===editingId);
    d.category = formCategory;
    d.name = name;
    d.buyPrice = buy;
    d.buyDate = buyDateInput.value || todayISO();
    d.status = formStatus;
    d.sellPrice = formStatus==='sold' ? sell : null;
    d.sellDate = formStatus==='sold' ? (sellDateInput.value || todayISO()) : null;
    d.expenses = formExpenses.map(e=>({...e}));
  } else {
    deals.push({
      id: uid(),
      category: formCategory,
      name,
      buyPrice: buy,
      buyDate: buyDateInput.value || todayISO(),
      status: formStatus,
      sellPrice: formStatus==='sold' ? sell : null,
      sellDate: formStatus==='sold' ? (sellDateInput.value || todayISO()) : null,
      expenses: formExpenses.map(e=>({...e}))
    });
  }

  await persist();
  haptic('success');
  closeSheet();
  render();
});

deleteBtn.addEventListener('click', async ()=>{
  if (!deleteConfirmPending){
    deleteConfirmPending = true;
    deleteBtn.textContent = 'Точно удалить? Нажми ещё раз';
    haptic('error');
    deleteConfirmTimer = setTimeout(()=>{
      deleteConfirmPending = false;
      deleteBtn.textContent = 'Удалить сделку';
    }, 2800);
    return;
  }
  clearTimeout(deleteConfirmTimer);
  deleteConfirmPending = false;
  deals = deals.filter(d=>d.id!==editingId);
  await persist();
  haptic('success');
  closeSheet();
  render();
});

// ---------- INIT ----------
(async function init(){
  const raw = await storageGetRaw(STORAGE_KEY);
  if (raw){
    try{ deals = JSON.parse(raw) || []; }catch(e){ deals = []; }
  }
  render();
})();
</script>
</body>
</html>
